name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Allow only one deployment at a time
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # gh-pages needs to push to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity for gh-pages commit
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        run: npx gh-pages -d dist -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" -u "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
        env:
          # Token-embedded remote URL lets gh-pages authenticate the push
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
