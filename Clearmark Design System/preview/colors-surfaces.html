<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Colors — Surfaces</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="grid-3">
    <div class="swatch"><div class="chip" style="background:#FFFFFF;border-bottom:1px solid var(--rule);"></div><div class="label-row"><span class="name">White</span><span class="hex">FFFFFF</span></div></div>
    <div class="swatch"><div class="chip" style="background:#FAF6EE;"></div><div class="label-row"><span class="name">Cream</span><span class="hex">FAF6EE</span></div></div>
    <div class="swatch"><div class="chip" style="background:#F2EDE3;"></div><div class="label-row"><span class="name">Cream 2</span><span class="hex">F2EDE3</span></div></div>
  </div>
  <div style="margin-top:14px;font-size:11px;color:var(--ink-3);letter-spacing:-0.01em;">White for raised cards. Cream is the page. Cream 2 handles hover, table stripes, subtle bands.</div>
</div>
</body></html>
