<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Badges</title>
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="../components.css">
</head><body>
<div class="card">
  <div class="stack-4">
    <div>
      <div class="cap" style="margin-bottom:8px;">Status</div>
      <div class="row" style="align-items:center;">
        <span class="badge">Draft</span>
        <span class="badge badge-info"><span class="dot"></span>In review</span>
        <span class="badge badge-warning"><span class="dot"></span>Awaiting signature</span>
        <span class="badge badge-success"><span class="dot"></span>Signed</span>
        <span class="badge badge-danger"><span class="dot"></span>Conflict</span>
        <span class="badge badge-accent">AI-suggested</span>
        <span class="badge badge-pill"><span class="dot"></span>v3.4</span>
      </div>
    </div>

    <div>
      <div class="cap" style="margin-bottom:8px;">Number</div>
      <div class="row" style="align-items:center;gap:12px;">
        <span class="badge-num">3</span>
        <span class="badge-num badge-num-accent">12</span>
        <span class="badge-num badge-num-danger">4</span>
        <span class="badge-num badge-num-success">96</span>
        <span class="badge-num badge-num-soft">1,284</span>
        <span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);">
          Tasks <span class="badge-num badge-num-danger">7</span>
        </span>
        <span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);">
          Inbox <span class="badge-num badge-num-soft">23</span>
        </span>
        <span style="position:relative;display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;color:var(--ink-2);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M14 20a2 2 0 0 1-4 0"/></svg>
          <span class="badge-num badge-num-danger" style="position:absolute;top:-4px;right:-6px;min-width:14px;height:14px;font-size:9px;padding:0 3px;box-shadow:0 0 0 2px var(--cream);">5</span>
        </span>
      </div>
    </div>

    <div>
      <div class="cap" style="margin-bottom:8px;">Icon</div>
      <div class="row" style="align-items:center;gap:12px;">
        <span class="badge-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 3H6v18h12V7l-4-4z"/><path d="M14 3v4h4"/></svg></span>
        <span class="badge-icon badge-icon-accent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v6M12 21v-2M3 12h6M21 12h-2M6 6l3 3M18 18l-3-3M6 18l3-3M18 6l-3 3"/></svg></span>
        <span class="badge-icon badge-icon-success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12l5 5L20 7"/></svg></span>
        <span class="badge-icon badge-icon-warning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg></span>
        <span class="badge-icon badge-icon-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 7H5l1 13h12zM9 7V4h6v3"/></svg></span>
        <span class="badge-icon badge-icon-info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 11.5a8.38 8.38 0 0 1-15.9 3.8L3 21l5.7-2.1A8.5 8.5 0 1 0 21 11.5z"/></svg></span>
        <span class="badge-icon badge-icon-lg badge-icon-accent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v6M12 21v-2M3 12h6M21 12h-2M6 6l3 3M18 18l-3-3M6 18l3-3M18 6l-3 3"/></svg></span>
        <span style="display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);">
          <span class="badge-icon badge-icon-success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12l5 5L20 7"/></svg></span>
          Signed by 3 parties
        </span>
      </div>
    </div>
  </div>
</div>
</body></html>
