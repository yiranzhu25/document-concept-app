<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="../components.css">
</head><body>
<div class="card">
  <div class="stack-4">
    <div class="row" style="align-items:center;">
      <button class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12l5 5L20 7"/></svg>Run analysis</button>
      <button class="btn btn-secondary">Save draft</button>
      <button class="btn btn-ghost">Cancel</button>
      <button class="btn btn-danger">Delete</button>
      <button class="btn btn-secondary btn-icon" aria-label="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </div>
    <div class="row" style="align-items:center;">
      <button class="btn btn-primary btn-sm">Run</button>
      <button class="btn btn-secondary btn-sm">Save</button>
      <button class="btn btn-primary btn-lg">Sign document</button>
      <button class="btn btn-secondary" disabled>Disabled</button>
    </div>
  </div>
</div>
</body></html>
