<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Tabs, Breadcrumb, Progress</title>
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="../components.css">
</head><body>
<div class="card">
  <div class="stack-4">
    <div class="crumbs">
      <a href="#">Matters</a>
      <span class="sep">›</span>
      <a href="#">Borden Acquisition</a>
      <span class="sep">›</span>
      <span class="current">MSA v3.4</span>
    </div>
    <div class="tabs">
      <button class="tab active">Document</button>
      <button class="tab">Redlines <span class="badge badge-danger" style="margin-left:6px;">4</span></button>
      <button class="tab">Cross-references</button>
      <button class="tab">Audit trail</button>
      <button class="tab">Signers</button>
    </div>
    <div class="stack-3">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-3);">
        <span>Page 14 of 32</span>
        <span style="font-variant-numeric:tabular-nums;">44%</span>
      </div>
      <div class="progress"><div class="bar" style="width:44%;"></div></div>
    </div>
  </div>
</div>
</body></html>
