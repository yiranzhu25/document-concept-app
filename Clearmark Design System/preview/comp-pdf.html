<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>PDF Viewer</title>
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="../components.css">
<style>
.pdf-stage {
  position: relative;
  background: var(--surface-3);
  border: 1px solid var(--rule);
  border-radius: 8px;
  height: 280px;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 16px 0;
}
.page {
  width: 240px;
  background: #fff;
  border: 1px solid var(--rule);
  box-shadow: 0 4px 12px -2px rgba(27,24,19,0.08);
  padding: 18px 20px;
  font-family: 'Manrope', sans-serif;
  position: relative;
}
.page h1 { font-size: 11px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 6px; }
.page .l { height: 4px; background: #DBD3C2; border-radius: 1px; margin: 4px 0; }
.page .l.short { width: 60%; }
.page .l.shorter { width: 40%; }
.page .l.mid { width: 80%; }
.page .hl { background: #F1E9D6; padding: 1px 3px; display:inline-block; border-radius: 2px; }
.page .annot {
  position: absolute; right: -8px; top: 110px;
  width: 12px; height: 12px; border-radius: 999px;
  background: var(--accent); border: 2px solid #fff;
}
.zoom-bar {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  background: rgba(246,242,234,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 4px;
  box-shadow: 0 4px 12px -2px rgba(27,24,19,0.12);
}
.zoom-btn {
  width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 0; border-radius: 999px;
  color: var(--ink-2); cursor: pointer;
}
.zoom-btn:hover { background: var(--surface-2); color: var(--ink); }
.zoom-btn svg { width: 14px; height: 14px; stroke-width: 1.5; }
.zoom-level { font-size: 11px; font-weight: 600; color: var(--ink); padding: 0 8px; font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
.zoom-sep { width: 1px; height: 16px; background: var(--rule); margin: 0 2px; }
.page-input { font-size: 11px; color: var(--ink); background: var(--surface-1); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 6px; width: 32px; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head><body>
<div class="card tight">
  <div class="pdf-stage">
    <div class="page">
      <h1>MASTER SERVICE AGREEMENT</h1>
      <div style="font-size:8px;color:var(--ink-3);margin-bottom:8px;">Between Borden Industries, Inc. and Halberd Capital LLC</div>
      <div class="l mid"></div><div class="l"></div><div class="l short"></div>
      <div class="l"></div><div class="l"></div><div class="l shorter"></div>
      <div style="margin-top:8px;font-size:9px;font-weight:700;">14.2 Indemnification</div>
      <div class="l"></div><div class="l mid"></div>
      <div style="margin:4px 0;font-size:8px;line-height:1.5;color:var(--ink-2);">…each Party shall <span class="hl">indemnify and hold harmless</span> the other Party from any and all losses…</div>
      <div class="l"></div><div class="l short"></div>
      <span class="annot"></span>
    </div>
    <div class="zoom-bar">
      <button class="zoom-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 6l-6 6 6 6"/></svg></button>
      <input class="page-input" value="14">
      <span style="font-size:11px;color:var(--ink-3);">/ 32</span>
      <button class="zoom-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 6l6 6-6 6"/></svg></button>
      <span class="zoom-sep"></span>
      <button class="zoom-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14"/></svg></button>
      <span class="zoom-level">120%</span>
      <button class="zoom-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg></button>
      <span class="zoom-sep"></span>
      <button class="zoom-btn" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="zoom-btn" title="Fit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
</div>
</body></html>
