<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Cards &amp; Metric</title>
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="../components.css">
</head><body>
<div class="card">
  <div class="grid-3" style="gap:14px;">
    <div class="surface-card" style="padding:16px;">
      <div class="cap" style="margin-bottom:8px;">Documents</div>
      <div style="font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);">1,284</div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--success);">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17l10-10M7 7h10v10"/></svg>
        +18 this week
      </div>
    </div>
    <div class="surface-card" style="padding:16px;">
      <div class="cap" style="margin-bottom:8px;">Awaiting signature</div>
      <div style="font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);">23</div>
      <div style="margin-top:8px;font-size:12px;color:var(--warning);">4 overdue</div>
    </div>
    <div class="surface-card" style="padding:16px;">
      <div class="cap" style="margin-bottom:8px;">AI confidence</div>
      <div style="font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);">96.4<span style="font-size:18px;color:var(--ink-3);font-weight:500;">%</span></div>
      <div style="margin-top:10px;"><div class="progress"><div class="bar" style="width:96%;"></div></div></div>
    </div>
  </div>
</div>
</body></html>
