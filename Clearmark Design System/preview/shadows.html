<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Shadows</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card" style="background:var(--cream);padding:40px 32px;">
  <div style="display:flex;gap:32px;align-items:center;justify-content:flex-start;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
      <div style="width:120px;height:80px;background:#FFF;border:1px solid var(--rule);border-radius:8px;"></div>
      <span class="cap" style="font-size:10px;">Rest</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
      <div style="width:120px;height:80px;background:#FFF;border:1px solid var(--rule);border-radius:8px;box-shadow:0 1px 0 0 rgba(27,24,19,0.04),0 1px 2px 0 rgba(27,24,19,0.04);"></div>
      <span class="cap" style="font-size:10px;">SM · hover</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
      <div style="width:120px;height:80px;background:#FFF;border:1px solid var(--rule);border-radius:8px;box-shadow:0 4px 12px -2px rgba(27,24,19,0.08),0 2px 4px -1px rgba(27,24,19,0.04);"></div>
      <span class="cap" style="font-size:10px;">MD · menus</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
      <div style="width:120px;height:80px;background:#FFF;border:1px solid var(--rule);border-radius:8px;box-shadow:0 20px 40px -8px rgba(27,24,19,0.18),0 8px 16px -4px rgba(27,24,19,0.08);"></div>
      <span class="cap" style="font-size:10px;">LG · modals</span>
    </div>
  </div>
</div>
</body></html>
