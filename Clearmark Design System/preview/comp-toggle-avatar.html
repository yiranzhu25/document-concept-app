<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Toggle &amp; Avatars</title>
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="../components.css">
<script src="../image-slot.js"></script>
<style>
/* Wrap an <image-slot> so it inherits the .avatar circle. */
.avatar image-slot {
  width: 100%;
  height: 100%;
  display: block;
  --image-slot-border: transparent;
  --image-slot-empty-bg: transparent;
}
.avatar { background: var(--surface-2); }
</style>
</head><body>
<div class="card">
  <div class="grid-2" style="gap:24px;align-items:start;">
    <div class="stack-3">
      <div class="cap">Toggle</div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="toggle on"></span>
        <span style="font-size:13px;color:var(--ink-2);">Show AI annotations</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="toggle"></span>
        <span style="font-size:13px;color:var(--ink-2);">Lock signing order</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="toggle on"></span>
        <span style="font-size:13px;color:var(--ink-2);">Notify on changes</span>
      </div>
    </div>
    <div class="stack-3">
      <div class="cap">Avatars · Drop images to replace</div>
      <div class="row" style="align-items:center;gap:8px;">
        <span class="avatar avatar-sm"><image-slot id="dsavatar-sm" shape="circle" src="../assets/avatars/p1.svg" placeholder=""></image-slot></span>
        <span class="avatar"><image-slot id="dsavatar-md" shape="circle" src="../assets/avatars/p2.svg" placeholder=""></image-slot></span>
        <span class="avatar avatar-lg"><image-slot id="dsavatar-lg" shape="circle" src="../assets/avatars/p3.svg" placeholder=""></image-slot></span>
        <span class="avatar avatar-xl"><image-slot id="dsavatar-xl" shape="circle" src="../assets/avatars/p4.svg" placeholder=""></image-slot></span>
        <span class="avatar" style="background:var(--accent);color:var(--cream);">SH</span>
      </div>
      <div class="avatar-stack">
        <span class="avatar"><image-slot id="dsavatar-stack-1" shape="circle" src="../assets/avatars/p1.svg" placeholder=""></image-slot></span>
        <span class="avatar"><image-slot id="dsavatar-stack-2" shape="circle" src="../assets/avatars/p2.svg" placeholder=""></image-slot></span>
        <span class="avatar"><image-slot id="dsavatar-stack-3" shape="circle" src="../assets/avatars/p3.svg" placeholder=""></image-slot></span>
        <span class="avatar"><image-slot id="dsavatar-stack-4" shape="circle" src="../assets/avatars/p5.svg" placeholder=""></image-slot></span>
        <span class="avatar" style="background:var(--surface-2);color:var(--ink-3);">+4</span>
      </div>
      <div style="font-size:10px;color:var(--ink-3);letter-spacing:-0.01em;">Drag any image onto an avatar to replace the illustration. Initials and brand-tinted variants stay text.</div>
    </div>
  </div>
</div>
</body></html>
