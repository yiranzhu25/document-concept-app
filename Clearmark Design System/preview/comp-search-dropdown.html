<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Search &amp; Dropdown</title>
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="../components.css">
<style>
.menu {
  background: var(--surface-1);
  border: 1px solid var(--rule-strong);
  border-radius: var(--radius-sm);
  box-shadow: 0 4px 12px -2px rgba(27,24,19,0.10), 0 2px 4px -1px rgba(27,24,19,0.06);
  padding: 4px;
}
.menu-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 10px;
  font-size: 13px;
  color: var(--ink-2);
  border-radius: 4px;
  cursor: pointer;
}
.menu-row:hover { background: var(--surface-2); color: var(--ink); }
.menu-row.is-selected { color: var(--ink); font-weight: 500; }
.menu-row.is-selected svg.check { color: var(--accent); }
.menu-row svg { width: 14px; height: 14px; stroke-width: 1.5; color: var(--ink-3); }
.menu-row.danger { color: var(--danger); }
.menu-row.danger:hover { background: var(--danger-soft); color: var(--danger); }
.menu-sep { height: 1px; background: var(--rule); margin: 4px 6px; }
.menu-cap { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); padding: 6px 10px 2px; }
</style>
</head><body>
<div class="card">
  <div class="grid-2" style="gap:20px;align-items:start;">
    <div class="stack-3">
      <div class="field-label">Search</div>
      <div class="input-with-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" placeholder="Search clauses, parties, dates…">
      </div>
      <div class="input-with-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" value="indemnif" style="border-color:var(--ink-3);box-shadow:0 1px 0 0 rgba(27,24,19,0.04),0 2px 6px -1px rgba(27,24,19,0.10);">
      </div>
      <div style="font-size:11px;color:var(--ink-3);letter-spacing:-0.01em;margin-top:2px;">Subtle warm shadow on focus — no ring.</div>
    </div>
    <div class="stack-3">
      <div class="field-label">Menu</div>
      <div class="menu" style="width:100%;">
        <div class="menu-cap">Document</div>
        <div class="menu-row">
          <span style="display:flex;align-items:center;gap:8px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M21 14v7H3V3h7"/></svg>Open in new tab</span>
        </div>
        <div class="menu-row is-selected">
          <span style="display:flex;align-items:center;gap:8px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 3H8v14h12V7l-4-4z"/><path d="M4 7v14h12"/></svg>Compare to previous</span>
          <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg>
        </div>
        <div class="menu-row">
          <span style="display:flex;align-items:center;gap:8px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 3H8v14h12V7l-4-4z"/><path d="M16 3v4h4"/></svg>Duplicate</span>
        </div>
        <div class="menu-row">
          <span style="display:flex;align-items:center;gap:8px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 21V9M6 15l6 6 6-6M5 3h14"/></svg>Download</span>
        </div>
        <div class="menu-sep"></div>
        <div class="menu-row danger">
          <span style="display:flex;align-items:center;gap:8px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 7H5l1 13h12zM9 7V4h6v3"/></svg>Delete</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
