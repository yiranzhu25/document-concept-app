<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div style="display:flex;gap:18px;align-items:flex-end;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:var(--surface-1);border:1px solid var(--rule);border-radius:4px;width:72px;height:72px;"></div><span class="cap" style="font-size:10px;">XS · 4</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:var(--surface-1);border:1px solid var(--rule);border-radius:6px;width:72px;height:72px;"></div><span class="cap" style="font-size:10px;">SM · 6</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:var(--surface-1);border:1px solid var(--rule);border-radius:8px;width:72px;height:72px;"></div><span class="cap" style="font-size:10px;">MD · 8</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:var(--surface-1);border:1px solid var(--rule);border-radius:12px;width:72px;height:72px;"></div><span class="cap" style="font-size:10px;">LG · 12</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:var(--surface-1);border:1px solid var(--rule);border-radius:16px;width:72px;height:72px;"></div><span class="cap" style="font-size:10px;">XL · 16</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:var(--surface-1);border:1px solid var(--rule);border-radius:999px;width:128px;height:36px;"></div><span class="cap" style="font-size:10px;">Pill</span></div>
  </div>
  <div style="margin-top:14px;font-size:11px;color:var(--ink-3);letter-spacing:-0.01em;">Pills are reserved for the single Status badge on summary rows.</div>
</div>
</body></html>
