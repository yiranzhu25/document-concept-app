<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div style="display:flex;align-items:flex-end;gap:14px;height:100px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:#2A2F4F;width:4px;height:4px;"></div><span class="cap" style="font-size:10px;">4</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:#2A2F4F;width:8px;height:8px;"></div><span class="cap" style="font-size:10px;">8</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:#2A2F4F;width:12px;height:12px;"></div><span class="cap" style="font-size:10px;">12</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:#2A2F4F;width:16px;height:16px;"></div><span class="cap" style="font-size:10px;">16</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:#2A2F4F;width:20px;height:20px;"></div><span class="cap" style="font-size:10px;">20</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:#2A2F4F;width:24px;height:24px;"></div><span class="cap" style="font-size:10px;">24</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:#2A2F4F;width:32px;height:32px;"></div><span class="cap" style="font-size:10px;">32</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:#2A2F4F;width:40px;height:40px;"></div><span class="cap" style="font-size:10px;">40</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:#2A2F4F;width:56px;height:56px;"></div><span class="cap" style="font-size:10px;">56</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="background:#2A2F4F;width:80px;height:56px;"></div><span class="cap" style="font-size:10px;">80</span></div>
  </div>
  <div style="margin-top:14px;font-size:11px;color:var(--ink-3);letter-spacing:-0.01em;">4px base. Dense surfaces use 8/12/16. Marketing surfaces use 24/32/56.</div>
</div>
</body></html>
