<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Logo &amp; Marks</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="grid-3" style="gap:18px;align-items:stretch;">
    <div style="background:var(--cream);border:1px solid var(--rule);border-radius:8px;padding:28px;display:flex;align-items:center;justify-content:center;">
      <img src="../assets/clearmark-logo.svg" height="40" alt="Clearmark">
    </div>
    <div style="background:var(--cream);border:1px solid var(--rule);border-radius:8px;padding:28px;display:flex;align-items:center;justify-content:center;">
      <img src="../assets/clearmark-glyph.svg" width="48" height="48" alt="Clearmark glyph">
    </div>
    <div style="background:#1B1813;border:1px solid #1B1813;border-radius:8px;padding:28px;display:flex;align-items:center;justify-content:center;">
      <img src="../assets/clearmark-glyph-reverse.svg" width="48" height="48" alt="Clearmark glyph reverse">
    </div>
  </div>
  <div style="margin-top:12px;font-size:11px;color:var(--ink-3);letter-spacing:-0.01em;">Wordmark + glyph · Glyph only · Reverse on ink. Wordmark in Manrope 500. Glyph stroke = ink (or cream on dark).</div>
</div>
</body></html>
