<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Type Scale</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div style="display:grid;grid-template-columns:64px 1fr 120px;gap:0 16px;align-items:baseline;row-gap:10px;">
    <span class="cap">72</span><span style="font-size:48px;font-weight:800;letter-spacing:-0.02em;color:var(--ink);line-height:1;">Aa</span><span class="cap">Display</span>
    <span class="cap">40</span><span style="font-size:32px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);line-height:1;">Aa</span><span class="cap">H1</span>
    <span class="cap">24</span><span style="font-size:22px;font-weight:600;color:var(--ink);line-height:1;">Aa</span><span class="cap">H2</span>
    <span class="cap">16</span><span style="font-size:16px;font-weight:600;color:var(--ink);line-height:1;">Aa</span><span class="cap">H3</span>
    <span class="cap">14</span><span style="font-size:14px;font-weight:400;color:var(--ink-2);line-height:1;">Aa</span><span class="cap">Body</span>
    <span class="cap">13</span><span style="font-size:13px;font-weight:500;color:var(--ink-2);line-height:1;">Aa</span><span class="cap">Label</span>
    <span class="cap">12</span><span style="font-size:12px;font-weight:400;color:var(--ink-3);line-height:1;">Aa</span><span class="cap">Meta</span>
    <span class="cap">11</span><span style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3);line-height:1;">Aa</span><span class="cap">Overline</span>
  </div>
</div>
</body></html>
