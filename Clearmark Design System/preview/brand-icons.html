<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Iconography</title>
<link rel="stylesheet" href="_card.css">
<style>
.icon-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 14px; }
.icon-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.icon-cell svg { width: 22px; height: 22px; stroke-width: 1.5; color: var(--ink); }
.icon-cell span { font-size: 9px; color: var(--ink-3); letter-spacing: -0.01em; }
</style>
</head><body>
<div class="card">
  <div class="icon-grid">
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 3H6v18h12V7l-4-4z"/><path d="M14 3v4h4"/></svg><span>document</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>search</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12l5 5L20 7"/></svg><span>check</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 6l6 6-6 6"/></svg><span>chevron</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg><span>plus</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14"/></svg><span>minus</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l3 2"/></svg><span>clock</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span>user</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v12M6 9l6-6 6 6M5 21h14"/></svg><span>upload</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 21V9M6 15l6 6 6-6M5 3h14"/></svg><span>download</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 11.5a8.38 8.38 0 0 1-15.9 3.8L3 21l5.7-2.1A8.5 8.5 0 1 0 21 11.5z"/></svg><span>message</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M14 20a2 2 0 0 1-4 0"/></svg><span>bell</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>settings</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span>bookmark</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2v6M12 22v-2M2 12h6M22 12h-2M5 5l4 4M19 19l-4-4M5 19l4-4M19 5l-4 4"/></svg><span>sparkle</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M3 12h18M3 18h12"/></svg><span>filter</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3h18v18H3z"/><path d="M3 9h18M9 21V9"/></svg><span>table</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M21 14v7H3V3h7"/></svg><span>open</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 7H5l1 13h12zM9 7V4h6v3M10 11v5M14 11v5"/></svg><span>trash</span></div>
    <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><span>info</span></div>
  </div>
  <div style="margin-top:14px;font-size:11px;color:var(--ink-3);letter-spacing:-0.01em;">Lucide · 1.5px stroke · 16/22/24px · currentColor. Pair with labels whenever space allows.</div>
</div>
</body></html>
