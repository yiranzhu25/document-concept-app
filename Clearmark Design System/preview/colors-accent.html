<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Colors — Brand Accent</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="grid-4">
    <div class="swatch"><div class="chip" style="background:#2A2F4F;"></div><div class="label-row"><span class="name">Accent</span><span class="hex">2A2F4F</span></div></div>
    <div class="swatch"><div class="chip" style="background:#1E2240;"></div><div class="label-row"><span class="name">Hover</span><span class="hex">1E2240</span></div></div>
    <div class="swatch"><div class="chip" style="background:#161931;"></div><div class="label-row"><span class="name">Press</span><span class="hex">161931</span></div></div>
    <div class="swatch"><div class="chip" style="background:#E6E7EE;"></div><div class="label-row"><span class="name">Soft</span><span class="hex">E6E7EE</span></div></div>
  </div>
  <div style="margin-top:16px;display:flex;align-items:center;gap:16px;">
    <button style="background:#2A2F4F;color:#F6F2EA;border:0;border-radius:6px;padding:8px 14px;font-family:inherit;font-size:13px;font-weight:500;letter-spacing:-0.01em;">Run analysis</button>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px;background:#E6E7EE;color:#2A2F4F;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;">Ink Indigo</span>
    <span style="font-size:11px;color:var(--ink-3);letter-spacing:-0.01em;">Used for primary actions, active states, focus rings. Sparingly.</span>
  </div>
</div>
</body></html>
