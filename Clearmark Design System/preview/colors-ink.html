<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Colors — Ink Scale</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="grid-3">
    <div class="swatch"><div class="chip" style="background:#1B1813;"></div><div class="label-row"><span class="name">Ink</span><span class="hex">1B1813</span></div></div>
    <div class="swatch"><div class="chip" style="background:#3A352C;"></div><div class="label-row"><span class="name">Ink 2</span><span class="hex">3A352C</span></div></div>
    <div class="swatch"><div class="chip" style="background:#6E665A;"></div><div class="label-row"><span class="name">Ink 3</span><span class="hex">6E665A</span></div></div>
  </div>
  <div style="margin-top:14px;font-size:11px;color:var(--ink-3);letter-spacing:-0.01em;">Ink for primary text. Ink 2 for labels and secondary. Ink 3 for metadata and tertiary. Warm near-black at the top of the ramp — never #000.</div>
</div>
</body></html>
