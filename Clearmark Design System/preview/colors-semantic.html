<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Colors — Semantic</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="grid-4">
    <div class="stack-2">
      <div class="swatch"><div class="chip" style="background:#3C6B4A;"></div><div class="label-row"><span class="name">Success</span><span class="hex">3C6B4A</span></div></div>
      <div style="background:#E5EDE7;color:#3C6B4A;font-size:12px;padding:6px 10px;border-radius:4px;font-weight:500;">Signed</div>
    </div>
    <div class="stack-2">
      <div class="swatch"><div class="chip" style="background:#7A5B1F;"></div><div class="label-row"><span class="name">Warning</span><span class="hex">7A5B1F</span></div></div>
      <div style="background:#F1E9D6;color:#7A5B1F;font-size:12px;padding:6px 10px;border-radius:4px;font-weight:500;">Awaiting review</div>
    </div>
    <div class="stack-2">
      <div class="swatch"><div class="chip" style="background:#8B2A2A;"></div><div class="label-row"><span class="name">Danger</span><span class="hex">8B2A2A</span></div></div>
      <div style="background:#F1DEDE;color:#8B2A2A;font-size:12px;padding:6px 10px;border-radius:4px;font-weight:500;">Conflict found</div>
    </div>
    <div class="stack-2">
      <div class="swatch"><div class="chip" style="background:#2A4F6B;"></div><div class="label-row"><span class="name">Info</span><span class="hex">2A4F6B</span></div></div>
      <div style="background:#DEE8F0;color:#2A4F6B;font-size:12px;padding:6px 10px;border-radius:4px;font-weight:500;">In review</div>
    </div>
  </div>
</div>
</body></html>
